<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Manager</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 800px;
            margin: auto;
        }

        .card {
            background: white;
            padding: 20px;
            margin-bottom: 20px;
            border-radius: 12px;
            box-shadow: 0 3px 10px rgba(0,0,0,0.1);
        }

        input, textarea, select, button {
            width: 100%;
            padding: 10px;
            margin: 6px 0;
            border-radius: 6px;
            border: 1px solid #ccc;
        }

        button {
            background: #4f46e5;
            color: white;
            border: none;
            cursor: pointer;
        }

        .delete {
            background: #dc2626;
        }

        @media (max-width: 600px) {
            body {
                padding: 10px;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <div class="card">
        <h1>Task Manager</h1>

        <form action="/add" method="POST">

            <input
                type="text"
                name="title"
                placeholder="Task title"
                required
            >

            <textarea
                name="description"
                placeholder="Task description"
            ></textarea>

            <button type="submit">Add Task</button>

        </form>
    </div>

    <div class="card">

        <h2>My Tasks</h2>

        {% if tasks %}

            {% for task in tasks %}

                <div class="card">

                    <form action="/update/{{ task.id }}" method="POST">

                        <input
                            type="text"
                            name="title"
                            value="{{ task.title }}"
                            required
                        >

                        <textarea name="description">{{ task.description }}</textarea>

                        <select name="status">
                            <option {% if task.status == "Pending" %}selected{% endif %}>
                                Pending
                            </option>

                            <option {% if task.status == "In Progress" %}selected{% endif %}>
                                In Progress
                            </option>

                            <option {% if task.status == "Completed" %}selected{% endif %}>
                                Completed
                            </option>
                        </select>

                        <button type="submit">Update</button>

                    </form>

                    <form action="/delete/{{ task.id }}" method="POST">

                        <button class="delete" type="submit">
                            Delete
                        </button>

                    </form>

                </div>

            {% endfor %}

        {% else %}

            <p>No tasks yet. Add your first task above.</p>

        {% endif %}

    </div>

</div>

</body>
</html>
